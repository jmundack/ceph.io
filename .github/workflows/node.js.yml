name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23.7.0'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Example deployment: GitHub Pages with a unique preview URL per PR
      - name: Deploy preview (e.g., to GitHub Pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}
      # Comment PR with preview link
      - name: Comment PR with Preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-link
          message: |
            :rocket: Preview deployed!
            :link: [View Preview](https://your-user.github.io/your-repo/pr-preview/pr-${{ github.event.pull_request.number }})
